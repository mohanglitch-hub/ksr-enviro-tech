  <circle cx="630" cy="140" r="70" fill="#7AC943" opacity="0.14"/>
  <circle cx="630" cy="140" r="48" fill="#7AC943"/>
  <path d="M630 110 C612 132, 604 148, 630 166 C656 148, 648 132, 630 110 Z" fill="#ffffff"/>

