  <ellipse cx="410" cy="330" rx="80" ry="20" fill="#ffffff"/>
  <rect x="330" y="375" width="160" height="15" fill="#00A8A8" opacity="0.28"/>
  <rect x="330" y="420" width="160" height="15" fill="#00A8A8" opacity="0.28"/>
  <rect x="330" y="465" width="160" height="15" fill="#00A8A8" opacity="0.28"/>
  <rect x="330" y="510" width="160" height="15" fill="#00A8A8" opacity="0.28"/>

  <!-- Tank 3 (right, small-medium) -->
  <rect x="530" y="450" width="120" height="130" rx="10" fill="url(#tankGradA)"/>
  <ellipse cx="590" cy="450" rx="60" ry="16" fill="#ffffff"/>
  <rect x="530" y="485" width="120" height="13" fill="#7AC943" opacity="0.25"/>
  <rect x="530" y="520" width="120" height="13" fill="#7AC943" opacity="0.25"/>

  <!-- small control building -->
  <rect x="610" y="520" width="90" height="60" rx="4" fill="#dde8f5"/>
  <rect x="622" y="535" width="18" height="18" fill="#0A2540" opacity="0.5"/>
  <rect x="650" y="535" width="18" height="18" fill="#0A2540" opacity="0.5"/>
  <rect x="678" y="535" width="14" height="45" fill="#0066CC"/>

  <!-- tank support legs -->
  <rect x="195" y="580" width="12" height="18" fill="#0d3a66"/>
  <rect x="235" y="580" width="12" height="18" fill="#0d3a66"/>
  <rect x="375" y="580" width="12" height="18" fill="#0d3a66"/>
  <rect x="440" y="580" width="12" height="18" fill="#0d3a66"/>
  <rect x="555" y="580" width="12" height="18" fill="#0d3a66"/>
  <rect x="605" y="580" width="12" height="18" fill="#0d3a66"/>

