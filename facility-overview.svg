<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="60%" stop-color="#0d3a66"/>
      <stop offset="100%" stop-color="#0d4a6e"/>
    </linearGradient>
    <linearGradient id="tankGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7e8f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#skyGrad)"/>

  <!-- dot texture -->
  <g opacity="0.06">
    <circle cx="40" cy="40" r="2.5" fill="#ffffff"/><circle cx="90" cy="40" r="2.5" fill="#ffffff"/><circle cx="140" cy="40" r="2.5" fill="#ffffff"/><circle cx="190" cy="40" r="2.5" fill="#ffffff"/><circle cx="240" cy="40" r="2.5" fill="#ffffff"/><circle cx="290" cy="40" r="2.5" fill="#ffffff"/><circle cx="340" cy="40" r="2.5" fill="#ffffff"/><circle cx="390" cy="40" r="2.5" fill="#ffffff"/><circle cx="440" cy="40" r="2.5" fill="#ffffff"/><circle cx="490" cy="40" r="2.5" fill="#ffffff"/><circle cx="540" cy="40" r="2.5" fill="#ffffff"/><circle cx="590" cy="40" r="2.5" fill="#ffffff"/><circle cx="640" cy="40" r="2.5" fill="#ffffff"/><circle cx="690" cy="40" r="2.5" fill="#ffffff"/><circle cx="740" cy="40" r="2.5" fill="#ffffff"/>
    <circle cx="40" cy="95" r="2.5" fill="#ffffff"/><circle cx="90" cy="95" r="2.5" fill="#ffffff"/><circle cx="140" cy="95" r="2.5" fill="#ffffff"/><circle cx="190" cy="95" r="2.5" fill="#ffffff"/><circle cx="240" cy="95" r="2.5" fill="#ffffff"/><circle cx="290" cy="95" r="2.5" fill="#ffffff"/><circle cx="340" cy="95" r="2.5" fill="#ffffff"/><circle cx="390" cy="95" r="2.5" fill="#ffffff"/><circle cx="440" cy="95" r="2.5" fill="#ffffff"/><circle cx="490" cy="95" r="2.5" fill="#ffffff"/><circle cx="540" cy="95" r="2.5" fill="#ffffff"/><circle cx="590" cy="95" r="2.5" fill="#ffffff"/><circle cx="640" cy="95" r="2.5" fill="#ffffff"/><circle cx="690" cy="95" r="2.5" fill="#ffffff"/><circle cx="740" cy="95" r="2.5" fill="#ffffff"/>
  </g>

  <!-- soft glow accents -->
  <circle cx="650" cy="150" r="160" fill="#0066CC" opacity="0.12"/>
  <circle cx="120" cy="650" r="140" fill="#00A8A8" opacity="0.10"/>

  <!-- ground -->
  <rect x="0" y="660" width="800" height="140" fill="#081f38"/>
  <rect x="0" y="655" width="800" height="8" fill="#0d3a66"/>

