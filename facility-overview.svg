  <!-- pipe network connecting tanks -->
  <rect x="150" y="560" width="500" height="14" rx="4" fill="#0066CC"/>
  <rect x="220" y="500" width="14" height="70" fill="#0066CC"/>
  <rect x="400" y="470" width="14" height="100" fill="#00A8A8"/>
  <rect x="560" y="520" width="14" height="50" fill="#0066CC"/>

  <!-- Tank 1 (left, medium) -->
