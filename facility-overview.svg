  <ellipse cx="220" cy="420" rx="70" ry="18" fill="#ffffff"/>
  <rect x="150" y="460" width="140" height="14" fill="#0066CC" opacity="0.22"/>
  <rect x="150" y="500" width="140" height="14" fill="#0066CC" opacity="0.22"/>
