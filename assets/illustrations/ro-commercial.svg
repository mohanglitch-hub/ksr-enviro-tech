<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#004d4d"/>
    </linearGradient>
    <linearGradient id="membraneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8A8"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad3)"/>
  <rect x="0" y="235" width="400" height="65" fill="#062424"/>
  <!-- RO membrane housing (horizontal cylinder) -->
  <rect x="90" y="120" width="220" height="70" rx="35" fill="#ffffff" opacity="0.95"/>
  <rect x="90" y="120" width="220" height="70" rx="35" fill="none" stroke="#0066CC" stroke-width="3" opacity="0.4"/>
  <!-- concentric membrane rings -->
  <circle cx="125" cy="155" r="26" fill="none" stroke="url(#membraneGrad)" stroke-width="4"/>
  <circle cx="125" cy="155" r="17" fill="none" stroke="url(#membraneGrad)" stroke-width="3" opacity="0.7"/>
  <circle cx="125" cy="155" r="8" fill="url(#membraneGrad)"/>
  <!-- inlet pipe -->
  <rect x="35" y="145" width="55" height="20" rx="4" fill="#0066CC"/>
  <!-- outlet pipe -->
  <rect x="310" y="145" width="55" height="20" rx="4" fill="#00A8A8"/>
  <!-- flow arrows -->
  <path d="M150 155 L185 155 M178 148 L185 155 L178 162" stroke="#0A2540" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M215 155 L250 155 M243 148 L250 155 L243 162" stroke="#0A2540" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- pure water droplets near outlet -->
  <circle cx="340" cy="90" r="28" fill="#ffffff" opacity="0.12"/>
  <path d="M340 75 C333 84, 330 90, 340 98 C350 90, 347 84, 340 75 Z" fill="#ffffff"/>
  <circle cx="370" cy="110" r="16" fill="#ffffff" opacity="0.08"/>
  <path d="M370 102 C366 107, 364 111, 370 115 C376 111, 374 107, 370 102 Z" fill="#ffffff" opacity="0.6"/>
</svg>
